# Namaz hatırlatma push bildirimlerini tetikler.
# Kurulum: GitHub repo Settings -> Secrets and variables -> Actions ->
# "CRON_SECRET" adında bir secret ekleyin (Vercel'deki CRON_SECRET ile aynı).
# Not: GitHub zamanlanmış görevleri birkaç dakika gecikebilir; repo 60 gün
# hareketsiz kalırsa GitHub bu görevi durdurur (Actions sekmesinden tekrar
# etkinleştirilebilir).
name: Namaz hatirlatmalari

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Hatirlatma ucunu cagir
        run: |
          curl -fsS -X POST "https://namaz365.com/api/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
